[package]
name = "universal-console-hub"
version = "0.1.0"
description = "Universal Console Hub 3.0 — Authentic Multi-Console Ecosystem for Windows"
authors = ["Universal Console Hub Contributors"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "universal_console_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables embedded `frontendDist` assets for standalone desktop binaries (used automatically by `tauri build`).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
